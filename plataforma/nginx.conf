# Sirve la SPA de Matex como estático (equivalente local de S3/CloudFront).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta que no sea un archivo real cae a index.html
  # (el ruteo lo maneja React en el cliente).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los .mjs (ES modules; p. ej. el worker de PDF.js) DEBEN servirse como JavaScript.
  # nginx no siempre mapea `.mjs`, y el navegador rechaza un módulo con MIME incorrecto
  # ("Failed to fetch dynamically imported module"). Va antes de /assets/ porque es regex
  # y toma precedencia; re-declara el cache porque estos archivos también viven en /assets/.
  location ~* \.mjs$ {
    types { }
    default_type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Cache larga para los assets con hash; el index.html no se cachea.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
