<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor matemático avanzado</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #11151b;
      --panel-2: #0f1318;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e7edf5;
      --muted: #8f9aae;
      --accent: #7c9cff;
      --accent-2: #9ad7ff;
      --danger: #ff7d7d;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      --radius: 18px;
      --toolbar-h: 64px;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(1200px 900px at 20% 0%, #121826 0%, var(--bg) 58%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      height: var(--toolbar-h);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(12, 15, 20, 0.78);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .toolbar .group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding-right: 8px;
      border-right: 1px solid var(--border);
    }

    .toolbar .group:last-child { border-right: 0; padding-right: 0; }

    .toolbar .label {
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-right: 2px;
      white-space: nowrap;
    }

    .tool-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      color: var(--text);
      border-radius: 12px;
      height: 40px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
      font-size: 13px;
      line-height: 1;
      white-space: nowrap;
      user-select: none;
    }

    .tool-btn:hover { transform: translateY(-1px); border-color: rgba(124,156,255,0.55); }
    .tool-btn:active { transform: translateY(0); }
    .tool-btn .glyph {
      font-size: 15px;
      color: var(--accent-2);
    }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1.25fr .95fr;
      gap: 12px;
      padding: 12px;
      min-height: 0;
    }

    .pane {
      background: rgba(17, 21, 27, 0.78);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-height: 0;
      overflow: hidden;
    }

    .pane-header {
      height: 46px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      background: rgba(255,255,255,0.02);
    }

    .pane-body {
      height: calc(100% - 46px);
      min-height: 0;
    }

    .editor-shell {
      height: 100%;
      overflow: auto;
      padding: 18px 18px 26px;
    }

    .editor-shell .tiptap {
      min-height: 100%;
      outline: none;
      color: var(--text);
      font-size: 16px;
      line-height: 1.75;
    }

    .editor-shell .tiptap p {
      margin: 0 0 1em;
    }

    .editor-shell .tiptap p.is-empty::before {
      content: attr(data-placeholder);
      color: rgba(143,154,174,0.55);
      pointer-events: none;
      float: left;
      height: 0;
    }

    .editor-shell .tiptap :is(h1,h2,h3,h4,h5,h6) {
      margin: 1.1em 0 .5em;
      line-height: 1.2;
    }

    .editor-shell .tiptap strong { font-weight: 700; }
    .editor-shell .tiptap em { font-style: italic; }
    .editor-shell .tiptap code {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      padding: 0.12rem 0.34rem;
      border-radius: 8px;
    }

    .source-shell {
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .source-shell textarea {
      flex: 1;
      width: 100%;
      resize: none;
      border: 0;
      outline: none;
      padding: 18px;
      background: transparent;
      color: #d8e4f2;
      font-size: 14px;
      line-height: 1.65;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      tab-size: 2;
    }

    .source-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px 18px;
    }

    .sync-btn {
      appearance: none;
      border: 1px solid rgba(124,156,255,0.45);
      background: linear-gradient(180deg, rgba(124,156,255,0.22), rgba(124,156,255,0.12));
      color: var(--text);
      border-radius: 12px;
      height: 38px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #4ade80;
      box-shadow: 0 0 0 4px rgba(74,222,128,.12);
      display: inline-block;
      margin-right: 8px;
      vertical-align: middle;
    }

    /* MathLive clean-up */
    math-field {
      --hue: 225;
      --caret-color: var(--accent);
      --selection-background-color: rgba(124,156,255,0.22);
      --keyboard-zindex: 1000;
      font-size: 1em;
      min-width: 1.25ch;
    }

    math-field::part(menu-toggle),
    math-field::part(virtual-keyboard-toggle) {
      display: none !important;
    }

    .math-inline-wrap,
    .math-block-wrap {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
    }

    .math-inline-wrap math-field {
      padding: 0.08rem 0.28rem;
      border-radius: 10px;
      border: 1px solid rgba(124,156,255,0.22);
      background: rgba(255,255,255,0.035);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .math-block-wrap {
      display: block;
      margin: 1rem 0;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(124,156,255,0.18);
      background: rgba(255,255,255,0.03);
      overflow-x: auto;
    }

    .math-block-wrap math-field {
      display: block;
      width: 100%;
      font-size: 1.18rem;
    }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .workspace {
        grid-template-columns: 1fr;
        min-height: auto;
      }
      .pane { min-height: 44vh; }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "@tiptap/core": "https://esm.sh/@tiptap/core@3.6.5?bundle",
        "@tiptap/starter-kit": "https://esm.sh/@tiptap/starter-kit@3.6.5?bundle",
        "mathlive": "https://esm.sh/mathlive@0.108.1?bundle"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <div class="toolbar" id="toolbar">
      <div class="group">
        <span class="label">Estructuras</span>
        <button class="tool-btn" data-latex="\frac{#?}{#?}" title="Fracción"><span class="glyph">a/b</span> Frac.</button>
        <button class="tool-btn" data-latex="\sqrt{#?}" title="Raíz cuadrada"><span class="glyph">√</span> Raíz</button>
        <button class="tool-btn" data-latex="\sqrt[#?]{#?}" title="Raíz n-ésima"><span class="glyph">∛</span> √n</button>
        <button class="tool-btn" data-latex="\lim_{#?\to#?} #?" title="Límite"><span class="glyph">lim</span> Lím.</button>
        <button class="tool-btn" data-latex="\int_{#?}^{#?} #?\, d#?" title="Integral"><span class="glyph">∫</span> Int.</button>
        <button class="tool-btn" data-latex="\sum_{#?}^{#?} #?" title="Sumatoria"><span class="glyph">Σ</span> Sum.</button>
      </div>
      <div class="group">
        <span class="label">Lógica</span>
        <button class="tool-btn" data-latex="\forall" title="Para todo"><span class="glyph">∀</span></button>
        <button class="tool-btn" data-latex="\exists" title="Existe"><span class="glyph">∃</span></button>
        <button class="tool-btn" data-latex="\neg" title="Negación"><span class="glyph">¬</span></button>
        <button class="tool-btn" data-latex="\land" title="Y lógico"><span class="glyph">∧</span></button>
        <button class="tool-btn" data-latex="\lor" title="O lógico"><span class="glyph">∨</span></button>
        <button class="tool-btn" data-latex="\to" title="Implicación"><span class="glyph">→</span></button>
      </div>
      <div class="group">
        <span class="label">Conjuntos</span>
        <button class="tool-btn" data-latex="\in" title="Pertenece"><span class="glyph">∈</span></button>
        <button class="tool-btn" data-latex="\notin" title="No pertenece"><span class="glyph">∉</span></button>
        <button class="tool-btn" data-latex="\subset" title="Subconjunto"><span class="glyph">⊂</span></button>
        <button class="tool-btn" data-latex="\subseteq" title="Subconjunto o igual"><span class="glyph">⊆</span></button>
        <button class="tool-btn" data-latex="\cup" title="Unión"><span class="glyph">∪</span></button>
        <button class="tool-btn" data-latex="\cap" title="Intersección"><span class="glyph">∩</span></button>
      </div>
      <div class="group">
        <span class="label">Acción</span>
        <button class="tool-btn" id="insertBlockBtn" title="Insertar bloque de ecuación"><span class="glyph">$$</span> Bloque</button>
      </div>
    </div>

    <div class="workspace">
      <section class="pane">
        <div class="pane-header">
          <span>Editor visual</span>
          <span id="editorStateLabel"><span class="status-dot"></span>activo</span>
        </div>
        <div class="pane-body">
          <div id="editor" class="editor-shell"></div>
        </div>
      </section>

      <section class="pane source-shell">
        <div class="pane-header">
          <span>Código fuente</span>
          <span class="hint">Markdown ligero + $...$ / $$...$$</span>
        </div>
        <textarea id="source" spellcheck="false" placeholder="Escribe Markdown y LaTeX aquí..."></textarea>
        <div class="source-actions">
          <button class="sync-btn" id="syncBtn">Sync → editor</button>
          <div class="hint">Ctrl/Cmd + Enter también sincroniza el panel de código.</div>
        </div>
      </section>
    </div>
  </div>

  <script type="module">
    import { Editor, Node, mergeAttributes, nodeInputRule } from "@tiptap/core";
    import StarterKit from "@tiptap/starter-kit";
    import "mathlive";

    const editorMount = document.getElementById("editor");
    const sourceEl = document.getElementById("source");
    const syncBtn = document.getElementById("syncBtn");
    const toolbar = document.getElementById("toolbar");
    const insertBlockBtn = document.getElementById("insertBlockBtn");
    const editorStateLabel = document.getElementById("editorStateLabel");

    let activeMathField = null;
    let suppressEditorToSource = false;
    let suppressSourceToEditor = false;

    function escapeMarkdownText(text) {
      return String(text)
        .replace(/\\/g, "\\\\")
        .replace(/\$/g, "\\$")
        .replace(/`/g, "\\`")
        .replace(/\*/g, "\\*")
        .replace(/_/g, "\\_")
        .replace(/~/g, "\\~");
    }

    function serializeInline(nodes = []) {
      return nodes.map(serializeNode).join("");
    }

    function serializeTextNode(node) {
      let value = escapeMarkdownText(node.text || "");
      const marks = Array.isArray(node.marks) ? node.marks.map((m) => m.type).filter(Boolean) : [];

      for (const mark of marks) {
        if (mark === "code") value = `\`${value.replace(/`/g, "\\`")}\``;
      }
      for (const mark of marks) {
        if (mark === "bold") value = `**${value}**`;
        if (mark === "italic") value = `*${value}*`;
        if (mark === "strike") value = `~~${value}~~`;
      }

      return value;
    }

    function serializeNode(node) {
      if (!node) return "";
      switch (node.type) {
        case "text":
          return serializeTextNode(node);
        case "hardBreak":
          return "  \n";
        case "inlineMath":
          return `$${(node.attrs?.latex || "").trim()}$`;
        case "blockMath":
          return `$$\n${(node.attrs?.latex || "").trim()}\n$$`;
        case "paragraph":
          return serializeInline(node.content || []);
        case "heading":
          return `${"#".repeat(node.attrs?.level || 1)} ${serializeInline(node.content || [])}`;
        default:
          if (Array.isArray(node.content)) return serializeInline(node.content);
          return "";
      }
    }

    function serializeDocToMarkdown(doc) {
      const blocks = [];

      for (const node of doc?.content || []) {
        if (node.type === "paragraph") {
          blocks.push(serializeInline(node.content || []));
        } else if (node.type === "blockMath") {
          blocks.push(`$$\n${(node.attrs?.latex || "").trim()}\n$$`);
        } else if (node.type === "heading") {
          blocks.push(`${"#".repeat(node.attrs?.level || 1)} ${serializeInline(node.content || [])}`);
        } else if (node.type === "blockquote") {
          const inner = (node.content || [])
            .map((block) => serializeNode(block))
            .join("\n\n")
            .split("\n")
            .map((line) => `> ${line}`)
            .join("\n");
          blocks.push(inner);
        } else if (Array.isArray(node.content)) {
          blocks.push(serializeInline(node.content));
        }
      }

      return blocks.join("\n\n").replace(/\n{3,}/g, "\n\n").trim();
    }

    function parseInlineMath(text) {
      const nodes = [];
      let buffer = "";
      let i = 0;

      const flush = () => {
        if (buffer.length) {
          nodes.push({ type: "text", text: buffer });
          buffer = "";
        }
      };

      while (i < text.length) {
        const ch = text[i];

        if (ch === "\\" && text[i + 1] === "$") {
          buffer += "$";
          i += 2;
          continue;
        }

        if (ch === "$" && text[i + 1] !== "$") {
          let j = i + 1;
          let found = false;

          while (j < text.length) {
            if (text[j] === "\\" && text[j + 1] === "$") {
              j += 2;
              continue;
            }
            if (text[j] === "$" && text[j + 1] !== "$") {
              found = true;
              break;
            }
            j += 1;
          }

          if (found) {
            flush();
            nodes.push({
              type: "inlineMath",
              attrs: { latex: text.slice(i + 1, j).trim() },
            });
            i = j + 1;
            continue;
          }
        }

        buffer += ch;
        i += 1;
      }

      flush();
      return nodes.length ? nodes : [{ type: "text", text: "" }];
    }

    function parseMarkdownToDoc(markdown) {
      const src = String(markdown || "").replace(/\r\n/g, "\n").trim();

      if (!src) {
        return {
          type: "doc",
          content: [{ type: "paragraph" }],
        };
      }

      const lines = src.split("\n");
      const blocks = [];
      let i = 0;

      while (i < lines.length) {
        const raw = lines[i];
        const line = raw.trim();

        if (!line) {
          i += 1;
          continue;
        }

        if (line === "$$") {
          i += 1;
          const latexLines = [];
          while (i < lines.length && lines[i].trim() !== "$$") {
            latexLines.push(lines[i]);
            i += 1;
          }
          if (i < lines.length && lines[i].trim() === "$$") i += 1;
          blocks.push({
            type: "blockMath",
            attrs: { latex: latexLines.join("\n").trim() },
          });
          continue;
        }

        if (/^\$\$[\s\S]*\$\$$/.test(line)) {
          const inner = line.slice(2, -2).trim();
          blocks.push({
            type: "blockMath",
            attrs: { latex: inner },
          });
          i += 1;
          continue;
        }

        const paragraphLines = [];
        while (i < lines.length) {
          const current = lines[i].trim();
          if (!current) break;
          if (current === "$$") break;
          if (/^\$\$[\s\S]*\$\$$/.test(current)) break;
          paragraphLines.push(lines[i]);
          i += 1;
        }

        const paragraphText = paragraphLines.join(" ").replace(/\s+/g, " ").trim();
        blocks.push({
          type: "paragraph",
          content: parseInlineMath(paragraphText),
        });
      }

      return {
        type: "doc",
        content: blocks.length ? blocks : [{ type: "paragraph" }],
      };
    }

    function createMathNode({ name, inline, group, blockDisplay }) {
      return Node.create({
        name,
        group,
        inline,
        atom: true,
        selectable: true,
        draggable: false,
        defining: true,
        addAttributes() {
          return {
            latex: {
              default: "",
              parseHTML: (element) => element.getAttribute("data-latex") || element.textContent || "",
              renderHTML: (attributes) => ({ "data-latex": attributes.latex || "" }),
            },
          };
        },
        parseHTML() {
          return [
            {
              tag: `${inline ? "math-field" : "math-field"}[data-type="${name}"]`,
            },
            {
              tag: `${inline ? "span" : "div"}[data-type="${name}"]`,
            },
          ];
        },
        renderHTML({ HTMLAttributes, node }) {
          const attrs = mergeAttributes(
            HTMLAttributes,
            {
              "data-type": name,
              "data-latex": node.attrs.latex || "",
              "math-virtual-keyboard-policy": "manual",
              "popover-policy": "off",
            },
          );

          return [
            inline ? "span" : "div",
            attrs,
            [ "math-field", { "math-virtual-keyboard-policy": "manual", "popover-policy": "off" }, node.attrs.latex || "" ],
          ];
        },
        addInputRules() {
          const rule = inline
            ? nodeInputRule({
                find: /\$([^\n$]+?)\$$/,
                type: this.type,
                getAttributes: (match) => ({ latex: match[1].trim() }),
              })
            : nodeInputRule({
                find: /^\$\$([\s\S]+?)\$\$$/,
                type: this.type,
                getAttributes: (match) => ({ latex: match[1].trim() }),
              });

          return [rule];
        },
        addNodeView() {
          return ({ editor, node, getPos }) => {
            const wrapper = document.createElement(inline ? "span" : "div");
            wrapper.className = inline ? "math-inline-wrap" : "math-block-wrap";
            const field = document.createElement("math-field");
            field.setAttribute("math-virtual-keyboard-policy", "manual");
            field.setAttribute("popover-policy", "off");
            field.setAttribute("default-mode", "math");
            field.setAttribute("tabindex", "0");
            field.spellcheck = false;
            field.value = node.attrs.latex || "";

            const syncToNode = () => {
              if (typeof getPos !== "function" || editor.isDestroyed) return;
              const latex = field.value || "";
              const current = node.attrs.latex || "";
              if (latex === current) return;

              const pos = getPos();
              const tr = editor.state.tr.setNodeMarkup(pos, undefined, {
                ...node.attrs,
                latex,
              });
              editor.view.dispatch(tr);
            };

            const setActive = () => {
              activeMathField = field;
            };

            const unsetActive = () => {
              if (activeMathField === field) activeMathField = null;
            };

            field.addEventListener("focus", setActive);
            field.addEventListener("blur", unsetActive);
            field.addEventListener("input", syncToNode);
            field.addEventListener("change", syncToNode);

            wrapper.appendChild(field);

            return {
              dom: wrapper,
              update(updatedNode) {
                if (updatedNode.type !== node.type) return false;
                node = updatedNode;
                const nextLatex = updatedNode.attrs.latex || "";
                if (field.value !== nextLatex) field.value = nextLatex;
                return true;
              },
              stopEvent: (event) => event.target === field || field.contains(event.target),
              ignoreMutation: () => true,
              destroy() {
                field.removeEventListener("focus", setActive);
                field.removeEventListener("blur", unsetActive);
                field.removeEventListener("input", syncToNode);
                field.removeEventListener("change", syncToNode);
                if (activeMathField === field) activeMathField = null;
              },
            };
          };
        },
      });
    }

    const InlineMath = createMathNode({
      name: "inlineMath",
      inline: true,
      group: "inline",
    });

    const BlockMath = createMathNode({
      name: "blockMath",
      inline: false,
      group: "block",
    });

    function insertIntoActiveMathField(latex) {
      if (!activeMathField) return false;
      activeMathField.focus();
      activeMathField.insert(latex);
      return true;
    }

    function insertBlockMathAtCursor(editor, latex = "\\frac{#?}{#?}") {
      editor.chain().focus().insertContent({
        type: "blockMath",
        attrs: { latex },
      }).run();
      return true;
    }

    const editor = new Editor({
      element: editorMount,
      extensions: [
        StarterKit,
        InlineMath,
        BlockMath,
      ],
      content: {
        type: "doc",
        content: [
          {
            type: "paragraph",
            content: [
              { type: "text", text: "Escribe texto normal y usa la toolbar para insertar fórmulas. Por ejemplo, " },
              { type: "inlineMath", attrs: { latex: "x^2+y^2=z^2" } },
              { type: "text", text: " o un bloque de ecuación debajo." },
            ],
          },
          {
            type: "blockMath",
            attrs: { latex: "\\int_{0}^{1} x^2\\,dx = \\frac{1}{3}" },
          },
          {
            type: "paragraph",
            content: [
              { type: "text", text: "En el panel derecho verás Markdown ligero con delimitadores $" },
              { type: "text", text: " y $$" },
              { type: "text", text: "." },
            ],
          },
        ],
      },
      editorProps: {
        attributes: {
          class: "tiptap",
          spellcheck: "false",
        },
      },
      onUpdate({ editor }) {
        if (suppressEditorToSource) return;
        if (document.activeElement === sourceEl) return;
        const markdown = serializeDocToMarkdown(editor.getJSON());
        suppressSourceToEditor = true;
        sourceEl.value = markdown;
        suppressSourceToEditor = false;
      },
      onSelectionUpdate() {
        editorStateLabel.innerHTML = "<span class='status-dot'></span>activo";
      },
      onFocus() {
        editorStateLabel.innerHTML = "<span class='status-dot'></span>activo";
      },
      onBlur() {
        editorStateLabel.innerHTML = "<span class='status-dot' style='background:#fbbf24; box-shadow:0 0 0 4px rgba(251,191,36,.12)'></span>inactivo";
      },
    });

    function syncEditorToSource() {
      const markdown = serializeDocToMarkdown(editor.getJSON());
      suppressSourceToEditor = true;
      sourceEl.value = markdown;
      suppressSourceToEditor = false;
    }

    function syncSourceToEditor() {
      const markdown = sourceEl.value;
      const doc = parseMarkdownToDoc(markdown);

      suppressEditorToSource = true;
      editor.commands.setContent(doc, { emitUpdate: false });
      suppressEditorToSource = false;

      syncEditorToSource();
    }

    toolbar.addEventListener("click", (event) => {
      const button = event.target.closest(".tool-btn");
      if (!button) return;

      const latex = button.dataset.latex;
      if (!latex) return;

      const inserted = insertIntoActiveMathField(latex);
      if (!inserted) {
        editor.chain().focus().insertContent({
          type: "inlineMath",
          attrs: { latex },
        }).run();
      }
    });

    insertBlockBtn.addEventListener("click", () => {
      insertBlockMathAtCursor(editor, "\\lim_{#?\\to#?} #?");
    });

    sourceEl.addEventListener("input", () => {
      if (suppressSourceToEditor) return;
    });

    sourceEl.addEventListener("blur", () => {
      syncSourceToEditor();
    });

    sourceEl.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        event.preventDefault();
        syncSourceToEditor();
      }
    });

    syncBtn.addEventListener("click", syncSourceToEditor);

    window.addEventListener("beforeunload", () => {
      editor.destroy();
    });

    syncEditorToSource();
  </script>
</body>
</html>
