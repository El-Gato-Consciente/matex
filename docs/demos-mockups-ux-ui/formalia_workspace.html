<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formalia — Espacio de trabajo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root {
  --paper:    #fefcf8; --parch:  #f0ebe0; --warm:   #f5f0e8; --warm2:  #ece6da;
  --ink:      #1c1812; --ink2:   #4a4538; --ink3:   #9c9488; --ink4:   #c5bfb2;
  --brd:      #e0d9ce; --brd-s:  #ede8de;
  --blue:     #1e3a5f; --blue-m: #2a5299; --blue-f: #f0f5fb; --blue-p: #dce8f5;
  --acc:      #7b68c8; --acc-l:  #f3f0ff; --acc-bd: rgba(123,104,200,.25);
  --f-bg:     rgba(123,104,200,.06);  --f-bd:  rgba(123,104,200,.22);
  --f-hbg:    rgba(123,104,200,.12);  --f-hbd: rgba(123,104,200,.38);
  --f-abg:    rgba(123,104,200,.15);  --f-abd: #7b68c8;
  --f-glow:   0 0 0 3px rgba(123,104,200,.14);
  --green:    #2d5e3a; --green-bg: #edf7f0; --green-bd: #b0d9bc;
  --amber:    #7a5c28; --amber-bg: #fdf5e8; --amber-bd: #e8d5a8;
  --fd: 'Source Serif 4', Georgia, serif;
  --fu: 'DM Sans', system-ui, sans-serif;
  --fm: 'JetBrains Mono', monospace;
  --r: 6px; --rl: 11px; --rx: 16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--fu);background:var(--parch);color:var(--ink);display:flex;flex-direction:column;font-size:13.5px}

/* ── TOPBAR ─────────────────────────────────── */
#top{height:38px;flex-shrink:0;background:var(--paper);border-bottom:1px solid var(--brd);display:flex;align-items:center;padding:0 14px;z-index:10}
.tl{font-family:var(--fd);font-size:14px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:6px}
.tlm{width:19px;height:19px;border:2px solid var(--blue);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.tsep{width:1px;height:14px;background:var(--brd);margin:0 9px}
.tsp{flex:1}
.txp{height:24px;padding:0 12px;background:var(--blue);color:#fff;border:none;border-radius:var(--r);font-family:var(--fu);font-size:11px;font-weight:600;cursor:pointer}
.txp:hover{background:#163050}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px;transition:background .3s}
.save-dot.dirty{background:var(--amber)}
#doc-name{font-size:12px;color:var(--ink2);font-weight:500}

/* ── LAYOUT ─────────────────────────────────── */
#app{flex:1;display:flex;overflow:hidden;position:relative}

/* ── FORMULA PANEL (slides from top) ────────── */
#fp{position:absolute;top:0;left:0;right:0;height:58px;z-index:30;background:#f8f6ff;border-bottom:1px solid #e0d9f5;display:flex;align-items:stretch;transform:translateY(-100%);transition:transform .2s cubic-bezier(.4,0,.2,1);box-shadow:0 4px 14px rgba(123,104,200,.12)}
#fp.open{transform:translateY(0)}
#fp-lbl{width:106px;flex-shrink:0;border-right:1px solid var(--brd-s);display:flex;flex-direction:column;justify-content:center;padding:0 12px}
#fp-lbl .ft{font-size:7.5px;font-weight:600;text-transform:uppercase;letter-spacing:.11em;color:var(--ink4);margin-bottom:3px}
#fp-lbl .fy{font-size:11px;color:var(--blue-m);font-weight:500}
#fp-in{flex:1;padding:7px 10px;display:flex;align-items:center}
#fta{width:100%;height:100%;padding:4px 9px;border:1.5px solid transparent;border-radius:var(--r);background:rgba(255,255,255,.55);font-family:var(--fm);font-size:11.5px;color:var(--ink);outline:none;resize:none;transition:border-color .15s,background .15s,box-shadow .15s;caret-color:var(--acc);line-height:1.5}
#fta:focus{border-color:var(--f-abd);background:#fff;box-shadow:0 0 0 3px rgba(123,104,200,.10)}
#fp-acts{width:82px;flex-shrink:0;border-left:1px solid var(--brd-s);display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 8px}
.fpa{height:20px;border-radius:4px;border:1px solid var(--brd);background:transparent;font-family:var(--fu);font-size:9px;color:var(--ink3);cursor:pointer;transition:all .1s}
.fpa:hover{background:var(--warm);color:var(--ink)}
.fpa.sv{background:var(--blue);color:#fff;border-color:var(--blue)}
.fpa.sv:hover{background:#163050}

/* ── SYMBOL PALETTE (slides from left) ──────── */
#pal{width:0;flex-shrink:0;overflow:hidden;background:var(--warm);border-right:1px solid var(--brd);transition:width .2s cubic-bezier(.4,0,.2,1)}
#pal.open{width:168px}
.pali{width:168px;height:100%;overflow-y:auto;padding:6px 0 20px}
.pali::-webkit-scrollbar{width:3px}
.pali::-webkit-scrollbar-thumb{background:var(--brd)}
.psec{padding:6px 8px 9px}
.psec+.psec{border-top:1px solid var(--brd-s)}
.pshd{font-size:7.5px;font-weight:600;text-transform:uppercase;letter-spacing:.11em;color:var(--ink4);margin-bottom:5px}
.pgrid{display:flex;flex-wrap:wrap;gap:2px}
.pbtn{width:30px;height:26px;background:var(--paper);border:1px solid var(--brd);border-radius:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:background .09s,border-color .09s,transform .07s}
.pbtn:hover{background:#fff;border-color:var(--f-hbd);transform:translateY(-1px)}
.pbtn:active{transform:scale(.93)}
.pbtn .katex{font-size:.62em;line-height:1}
.pbtn span{font-size:5.5px;color:var(--ink4);font-family:var(--fu);line-height:1}

/* ── DOC SCROLL ─────────────────────────────── */
#ds{flex:1;overflow-y:auto;background:var(--parch);transition:padding-top .2s cubic-bezier(.4,0,.2,1)}
#ds.fp-open{padding-top:58px}
#ds::-webkit-scrollbar{width:7px}
#ds::-webkit-scrollbar-thumb{background:var(--brd);border-radius:4px}
#dp{max-width:620px;margin:32px auto 100px;background:var(--paper);padding:48px 56px 56px;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04),inset 0 0 0 1px rgba(0,0,0,.03);position:relative}

/* ── BLOCKS ─────────────────────────────────── */
.blk{position:relative;margin:0}
/* Left handle — shows on hover */
.blk-handle{position:absolute;left:-36px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:2px;opacity:0;transition:opacity .12s;pointer-events:none}
.blk:hover .blk-handle{opacity:1;pointer-events:all}
.plus-btn{width:22px;height:22px;border-radius:4px;border:1px solid var(--brd);background:var(--paper);color:var(--ink4);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;line-height:1;font-weight:300}
.plus-btn:hover{background:var(--blue-f);border-color:var(--blue-m);color:var(--blue-m)}
.drag-h{width:12px;height:22px;border:none;background:transparent;color:var(--ink4);cursor:grab;font-size:8px;display:flex;align-items:center;justify-content:center;opacity:.4}
.drag-h:hover{opacity:.9}

/* ── DOC TYPOGRAPHY ─────────────────────────── */
.bh1{font-family:var(--fd);font-size:1.45rem;font-weight:700;line-height:1.2;color:var(--ink);padding-bottom:10px;border-bottom:1.5px solid var(--brd);outline:none;cursor:text}
.bh1::before{content:'§ ';color:var(--ink4);font-weight:300;font-size:.62em;vertical-align:.2em}
.bh2{font-family:var(--fd);font-size:1.1rem;font-weight:600;color:var(--ink);padding-top:.4em;outline:none;cursor:text}
.bh2::before{content:'§§ ';color:var(--ink4);font-weight:300;font-size:.65em;vertical-align:.15em}
.bp{font-family:var(--fd);font-size:.96rem;line-height:1.85;color:var(--ink);outline:none;cursor:text;min-height:1.85em}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--ink4);font-style:italic;pointer-events:none}

/* Theorem environments */
.bthm{margin:.3rem 0;padding:11px 15px 11px 13px;border-left:3px solid;border-radius:0 var(--r) var(--r) 0}
.thm-lbl{font-family:var(--fu);font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;display:flex;align-items:center;gap:7px;margin-bottom:5px;user-select:none}
.thm-lbl span{flex:1}
.thm-lbl-del{width:16px;height:16px;border:none;background:none;cursor:pointer;color:rgba(0,0,0,.2);font-size:11px;border-radius:3px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .1s,background .1s}
.bthm:hover .thm-lbl-del{opacity:1}
.thm-lbl-del:hover{background:rgba(0,0,0,.08);color:rgba(0,0,0,.5)}
.thm-body{font-family:var(--fd);font-size:.94rem;line-height:1.82;outline:none;cursor:text;min-height:1.5em}
.theorem{border-color:#3a6091;background:#f0f5fb}
.theorem .thm-lbl{color:#1e3a5f}
.proof{border-color:#aaa;background:#f7f5f2}
.proof .thm-lbl{color:#555;font-style:italic}
.definition{border-color:#2d6a45;background:#edf7f0}
.definition .thm-lbl{color:#1a4a2e}
.lemma{border-color:#7b68c8;background:#f6f0ff}
.lemma .thm-lbl{color:#4a3a9c}
.exercise{border-color:#a06820;background:#fdf5e6}
.exercise .thm-lbl{color:#7a5c28}
.remark{border-color:#888;background:#f9f8f6}
.remark .thm-lbl{color:#666}

/* Math chips + display */
.mc{display:inline-flex;align-items:center;background:var(--f-bg);border:1px solid var(--f-bd);border-radius:4px;padding:1px 5px 2px;cursor:pointer;user-select:none;transition:background .12s,border-color .12s,box-shadow .12s}
.mc:hover{background:var(--f-hbg);border-color:var(--f-hbd)}
.mc.act{background:var(--f-abg);border-color:var(--f-abd);box-shadow:var(--f-glow)}
.mc .katex{font-size:.93em}
.md{display:flex;justify-content:center;align-items:center;padding:18px 24px;margin:.35rem 0;background:var(--f-bg);border:1px solid var(--f-bd);border-radius:var(--rl);cursor:pointer;position:relative;transition:background .12s,border-color .12s,box-shadow .12s;user-select:none}
.md:hover{background:var(--f-hbg);border-color:var(--f-hbd)}
.md.act{background:var(--f-abg);border-color:var(--f-abd);box-shadow:var(--f-glow)}
.md .dh{position:absolute;top:5px;right:9px;font-size:8px;color:var(--f-bd);font-family:var(--fu);opacity:0;transition:opacity .14s;pointer-events:none}
.md:hover .dh{opacity:1}
.katex-display{margin:0!important}

/* ── FLOATING: SELECTION BUBBLE ─────────────── */
#sbub{position:fixed;z-index:50;display:none;background:#1c1812;border-radius:var(--rl);padding:4px 5px;gap:1px;box-shadow:0 4px 16px rgba(0,0,0,.26);flex-direction:row;align-items:center}
#sbub.show{display:flex}
#sbub::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:#1c1812;border-bottom:none}
.sb{width:28px;height:26px;border:none;border-radius:5px;background:transparent;color:rgba(255,255,255,.75);cursor:pointer;font-size:12px;font-family:var(--fu);display:flex;align-items:center;justify-content:center;transition:background .08s}
.sb:hover{background:rgba(255,255,255,.14);color:#fff}
.ssep{width:1px;height:15px;background:rgba(255,255,255,.14);margin:0 2px}

/* ── FLOATING: SLASH MENU ───────────────────── */
#smenu{position:fixed;z-index:60;display:none;background:var(--paper);border:1px solid var(--brd);border-radius:var(--rx);width:240px;box-shadow:0 4px 24px rgba(0,0,0,.12);overflow:hidden}
#smenu.show{display:block;animation:slideUp .15s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#smenu-search{display:flex;align-items:center;gap:8px;padding:9px 12px 7px;border-bottom:1px solid var(--brd-s)}
#smenu-search input{flex:1;border:none;outline:none;font-family:var(--fu);font-size:12.5px;color:var(--ink);background:transparent}
#smenu-search input::placeholder{color:var(--ink4)}
#smenu-list{max-height:270px;overflow-y:auto;padding:4px}
.sm-sec{font-size:7.5px;font-weight:600;text-transform:uppercase;letter-spacing:.10em;color:var(--ink4);padding:7px 9px 3px}
.sm-row{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;cursor:pointer;transition:background .09s}
.sm-row:hover,.sm-row.focused{background:var(--blue-f)}
.sm-ico{width:28px;height:28px;border-radius:5px;background:var(--warm);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--fm);font-weight:600;color:var(--ink3);flex-shrink:0}
.sm-info .sm-name{font-size:12px;font-weight:500;color:var(--ink)}
.sm-info .sm-desc{font-size:9.5px;color:var(--ink4)}
.sm-kbd{font-family:var(--fm);font-size:8px;color:var(--ink4);background:var(--warm);border:1px solid var(--brd-s);border-radius:3px;padding:1px 4px;flex-shrink:0}

/* ── FLOATING: HEADING LEVEL CTRL ───────────── */
#hctrl{position:fixed;z-index:50;display:none;background:var(--paper);border:1px solid var(--brd);border-radius:var(--rl);padding:3px 4px;box-shadow:0 2px 10px rgba(0,0,0,.09);flex-direction:row;align-items:center;gap:1px}
#hctrl.show{display:flex}
.hcb{width:26px;height:24px;border:none;border-radius:4px;background:transparent;font-family:var(--fu);font-size:11px;font-weight:600;color:var(--ink3);cursor:pointer;transition:background .09s,color .09s;display:flex;align-items:center;justify-content:center}
.hcb:hover{background:var(--warm);color:var(--ink2)}
.hcb.on{background:var(--blue-f);color:var(--blue-m)}

/* ── COACH PANEL (slides from right) ────────── */
#coach{width:0;flex-shrink:0;overflow:hidden;background:#fdfcf9;border-left:1px solid var(--brd);transition:width .2s cubic-bezier(.4,0,.2,1)}
#coach.open{width:208px}
.ci{width:208px;height:100%;overflow-y:auto;display:flex;flex-direction:column}
.ci::-webkit-scrollbar{width:3px}
#chhd{height:30px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--brd-s);flex-shrink:0;gap:6px}
.cht{font-size:7.5px;font-weight:600;text-transform:uppercase;letter-spacing:.10em;color:var(--ink4);flex:1}
.chx{width:18px;height:18px;border:none;background:none;cursor:pointer;color:var(--ink4);font-size:11px;border-radius:3px;display:flex;align-items:center;justify-content:center}
.chx:hover{background:var(--warm2)}
#chbody{flex:1;overflow-y:auto}
.chhint{font-size:9.5px;color:var(--ink3);line-height:1.5;padding:8px 10px;border-bottom:1px solid var(--brd-s)}
.chhint strong{color:var(--ink2)}
.envpill{display:inline-flex;font-size:7.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--warm2);border:1px solid var(--brd);color:var(--ink3);border-radius:20px;padding:2px 5px;margin-bottom:5px}
.chcards{padding:6px 8px;display:flex;flex-direction:column;gap:5px}
.chcard{border-radius:var(--r);border:1px solid;overflow:hidden;transition:opacity .18s}
.chcard.warn{border-color:var(--amber-bd)}
.chcard.info{border-color:var(--brd-s)}
.chcard-hd{display:flex;align-items:center;gap:4px;padding:4px 8px;font-size:9.5px;font-weight:600}
.chcard.warn .chcard-hd{background:var(--amber-bg);color:var(--amber)}
.chcard.info .chcard-hd{background:var(--warm);color:var(--ink3)}
.cbadge{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 4px;border-radius:2px}
.chcard.warn .cbadge{background:rgba(122,92,40,.15);color:var(--amber)}
.chcard.info .cbadge{background:rgba(0,0,0,.07);color:var(--ink3)}
.chbd{padding:5px 8px 6px;background:#fff}
.chjust{font-size:9px;color:var(--ink2);line-height:1.5;margin-bottom:5px}
.chcode{font-family:var(--fm);font-size:8px;line-height:1.6;background:#fafaf8;border:1px solid var(--brd-s);border-radius:3px;padding:3px 6px;margin-bottom:5px}
.cbefore{color:#b03030;opacity:.75;text-decoration:line-through}
.cafter{color:#2d6a45}
.chacts{display:flex;gap:3px}
.ca{height:18px;padding:0 6px;border-radius:3px;border:1px solid var(--brd);background:transparent;font-family:var(--fu);font-size:8.5px;color:var(--ink3);cursor:pointer;transition:all .1s}
.ca:hover{background:var(--warm)}
.ca.ok{background:var(--green-bg);border-color:var(--green-bd);color:var(--green)}
.ca.ok:hover{background:#daeee3}
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="top">
  <div class="tl"><span class="tlm">F</span>Formalia</div>
  <div class="tsep"></div>
  <span class="save-dot" id="sdot"></span>
  <span id="doc-name">Análisis II — TP 1</span>
  <div class="tsp"></div>
  <button class="txp">Exportar .tex ↓</button>
</div>

<div id="app">

  <!-- Formula panel -->
  <div id="fp">
    <div id="fp-lbl"><div class="ft">✎ Fórmula</div><div class="fy" id="fpty">Inline</div></div>
    <div id="fp-in"><textarea id="fta" rows="2" spellcheck="false" placeholder="LaTeX aquí…"></textarea></div>
    <div id="fp-acts">
      <button class="fpa sv" id="fpsave">✓ Guardar</button>
      <button class="fpa" id="fpcancel">✕ Cancelar</button>
    </div>
  </div>

  <!-- Symbol palette -->
  <div id="pal"><div class="pali" id="pali"></div></div>

  <!-- Document -->
  <div id="ds"><div id="dp"></div></div>

  <!-- Coach -->
  <div id="coach">
    <div class="ci">
      <div id="chhd"><span class="cht">Coach</span><button class="chx" id="chclose">✕</button></div>
      <div id="chbody"></div>
    </div>
  </div>

</div>

<!-- Floating overlays -->
<div id="sbub">
  <button class="sb" title="Negrita" onmousedown="return false" onclick="fmt('bold')"><b>B</b></button>
  <button class="sb" title="Itálica" onmousedown="return false" onclick="fmt('italic')"><i>I</i></button>
  <div class="ssep"></div>
  <button class="sb" title="Fórmula inline" onmousedown="return false" onclick="wrapSelectionAsFml()" style="font-family:'Source Serif 4';font-size:13px">$</button>
</div>

<div id="smenu">
  <div id="smenu-search"><span style="color:var(--ink4);font-size:14px">⌕</span><input id="sminput" placeholder="Buscar bloque…" autocomplete="off"></div>
  <div id="smenu-list"></div>
</div>

<div id="hctrl">
  <button class="hcb on" data-l="1">H1</button>
  <button class="hcb" data-l="2">H2</button>
  <button class="hcb" data-l="3">H3</button>
</div>

<script>
'use strict';

/* ══════════════════════════════════════
   DOCUMENT MODEL
   ══════════════════════════════════════ */
let _uid = 50;
const uid = () => 'b' + (_uid++);

let BLOCKS = [
  {id:'b1', t:'h1', text:'Continuidad y Diferenciabilidad'},
  {id:'b2', t:'p', nodes:[
    {k:'t', v:'Sea '},
    {k:'m', v:'f:U\\subset\\mathbb{R}^n\\to\\mathbb{R}'},
    {k:'t', v:' una función definida en un abierto '},
    {k:'m', v:'U'},
    {k:'t', v:'. Decimos que '},
    {k:'m', v:'f'},
    {k:'t', v:' es '},
    {k:'em', v:'diferenciable'},
    {k:'t', v:' en '},
    {k:'m', v:'a\\in U'},
    {k:'t', v:' si existe '},
    {k:'m', v:'T:\\mathbb{R}^n\\to\\mathbb{R}'},
    {k:'t', v:' tal que:'},
  ]},
  {id:'b3', t:'md', latex:'\\lim_{h\\to 0}\\frac{f(a+h)-f(a)-T(h)}{\\|h\\|}=0'},
  {id:'b4', t:'p', nodes:[
    {k:'t', v:'En ese caso escribimos '},
    {k:'m', v:'Df(a)=T'},
    {k:'t', v:' y la matriz jacobiana es '},
    {k:'m', v:'J_f(a)'},
    {k:'t', v:'.'},
  ]},
  {id:'b5', t:'h2', text:'Regla de la Cadena'},
  {id:'b6', t:'thm', env:'theorem', label:'Teorema 2.1 (Regla de la Cadena)', nodes:[
    {k:'t', v:'Si '},
    {k:'m', v:'f'},
    {k:'t', v:' y '},
    {k:'m', v:'g'},
    {k:'t', v:' son diferenciables, entonces '},
    {k:'m', v:'g\\circ f'},

   RENDER
   ══════════════════════════════════════ */
function renderAll() {
  const dp = document.getElementById('dp');
  dp.innerHTML = '';
  BLOCKS.forEach(b => dp.appendChild(mkBlock(b)));
}

function mkBlock(b) {
  const wrap = document.createElement('div');
  wrap.className = 'blk';
  wrap.dataset.bid = b.id;
  wrap.dataset.bt  = b.t;

  // Handle
  const handle = document.createElement('div');
  handle.className = 'blk-handle';
  const drag = document.createElement('button');
  drag.className = 'drag-h'; drag.innerHTML = '⠿'; drag.title = 'Arrastrar';
  const plus = document.createElement('button');
  plus.className = 'plus-btn'; plus.textContent = '+';
  plus.title = 'Agregar bloque';
  plus.addEventListener('mousedown', e => { e.preventDefault(); showPlusMenu(e, b.id); });
  handle.appendChild(drag); handle.appendChild(plus);
  wrap.appendChild(handle);

  // Content
  let inner;
  if (b.t === 'h1') {
    inner = document.createElement('h1');
    inner.className = 'bh1'; inner.contentEditable = 'true';
    inner.dataset.ph = 'Título de sección…';
    inner.textContent = b.text || '';
  } else if (b.t === 'h2') {
    inner = document.createElement('h2');
    inner.className = 'bh2'; inner.contentEditable = 'true';
    inner.dataset.ph = 'Subtítulo…';
    inner.textContent = b.text || '';
  } else if (b.t === 'p') {
    inner = document.createElement('p');
    inner.className = 'bp'; inner.contentEditable = 'true';
    inner.dataset.ph = 'Escribí algo… (/ para insertar bloque)';
    setNodes(inner, b.nodes || []);
  } else if (b.t === 'md') {
    inner = document.createElement('div');
    inner.className = 'md';
    inner.dataset.latex = b.latex || '\\square';
    inner.innerHTML = '<span class="dh">✎ clic para editar</span>';
    renderMD(inner, b.latex || '\\square');
  } else if (b.t === 'thm') {
    inner = document.createElement('div');
    inner.className = `bthm ${b.env}`;
    const lbl = document.createElement('div');
    lbl.className = 'thm-lbl';
    const lblSpan = document.createElement('span'); lblSpan.textContent = b.label || b.env;
    const delBtn  = document.createElement('button');
    delBtn.className = 'thm-lbl-del'; delBtn.textContent = '✕'; delBtn.title = 'Eliminar entorno';
    delBtn.addEventListener('click', e => { e.stopPropagation(); removeBlock(b.id); });
    lbl.appendChild(lblSpan); lbl.appendChild(delBtn);
    const body = document.createElement('div');
    body.className = 'thm-body'; body.contentEditable = 'true';
    body.dataset.ph = 'Contenido del entorno…';
    setNodes(body, b.nodes || []);
    inner.appendChild(lbl); inner.appendChild(body);
  }

  if (inner) wrap.appendChild(inner);
  return wrap;
}

function setNodes(el, nodes) {
  el.innerHTML = '';
  nodes.forEach(n => {
    if (n.k === 't') {
      el.appendChild(document.createTextNode(n.v));
    } else if (n.k === 'em') {
      const em = document.createElement('em'); em.textContent = n.v;
      el.appendChild(em);
    } else if (n.k === 'm') {
      const chip = makeChip(n.v);
      el.appendChild(chip);
    }
  });
}

function makeChip(latex) {
  const chip = document.createElement('span');
  chip.className = 'mc'; chip.contentEditable = 'false';
  chip.dataset.latex = latex;
  try { katex.render(latex, chip, { throwOnError: false, displayMode: false }); }
  catch { chip.textContent = `$${latex}$`; }
  return chip;
}

function renderMD(el, latex) {
  const hint = el.querySelector('.dh');
  try { katex.render(latex, el, { throwOnError: false, displayMode: true }); }
  catch { el.textContent = latex; }
  if (hint) el.appendChild(hint);
}

function openFml(el, isDisplay) {

function closeFml(revert) {
  if (revert && activeFml && activeFmlOrig) {
    const isD = activeFml.classList.contains('md');
    if (isD) { activeFml.dataset.latex = activeFmlOrig; renderMD(activeFml, activeFmlOrig); }
    else { activeFml.dataset.latex = activeFmlOrig; try { katex.render(activeFmlOrig, activeFml, {throwOnError:false}); } catch {} }
  }
  if (activeFml) activeFml.classList.remove('act');

/* ══════════════════════════════════════
   KEYBOARD: Enter / Backspace / /
   ══════════════════════════════════════ */
document.getElementById('dp').addEventListener('keydown', e => {
  const el  = e.target;
  const blk = el.closest('.blk');
  if (!blk) return;
  const bid = blk.dataset.bid;

  // Enter → new paragraph
  if (e.key === 'Enter' && !e.shiftKey) {
    // Allow shift+Enter in thm bodies for soft break
    if (blk.dataset.bt === 'thm') return;
    e.preventDefault();
    const isEmpty = el.textContent.trim() === '';
    if (isEmpty) { showSlash(blk); return; }
    const nb = {id:uid(), t:'p', nodes:[]};
    BLOCKS.splice(BLOCKS.findIndex(b=>b.id===bid)+1, 0, nb);
    const newEl = mkBlock(nb);
    blk.after(newEl);
    const ed = newEl.querySelector('[contenteditable]');
    if (ed) { ed.focus(); placeAtStart(ed); }
    dirty();
    return;
  }

  // Backspace on empty block → remove
  if (e.key === 'Backspace') {
    const txt = el.textContent;
    if (txt === '' || (txt === '\n') || el.innerHTML === '<br>') {
      e.preventDefault();
      const prev = blk.previousElementSibling;
      removeBlock(bid);
      if (prev) { const ed = prev.querySelector('[contenteditable]'); if(ed){ed.focus(); placeAtEnd(ed);} }
      dirty();
      return;
    }
  }

  // / in empty block → slash menu
  if (e.key === '/') {
    const txt = el.textContent.trim();
    if (txt === '' || txt === '/') {
      e.preventDefault();
      showSlash(blk);
      return;
    }
  }

  // Arrow up to previous block
  if (e.key === 'ArrowUp') {
    const prev = blk.previousElementSibling;
    if (prev) { const ed = prev.querySelector('[contenteditable]'); if(ed){e.preventDefault();ed.focus();placeAtEnd(ed);} }
  }
  // Arrow down to next block
  if (e.key === 'ArrowDown') {
    const next = blk.nextElementSibling;
    if (next) { const ed = next.querySelector('[contenteditable]'); if(ed){e.preventDefault();ed.focus();placeAtStart(ed);} }
  }
  dirty();
});

function removeBlock(bid) {
  BLOCKS = BLOCKS.filter(b => b.id !== bid);
  document.querySelector(`.blk[data-bid="${bid}"]`)?.remove();
}

function insertAfter(refId, nb) {
  const idx = BLOCKS.findIndex(b => b.id === refId);
  BLOCKS.splice(idx+1, 0, nb);
  const refEl = document.querySelector(`.blk[data-bid="${refId}"]`);
  const newEl = mkBlock(nb);
  refEl.after(newEl);
  setTimeout(() => {
    const ed = newEl.querySelector('[contenteditable]');
    if (ed) { ed.focus(); placeAtStart(ed); }
  }, 30);
}

function placeAtStart(el) {
  el.focus();
  const r = document.createRange(); r.setStart(el,0); r.collapse(true);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}

function placeAtEnd(el) {
  el.focus();
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}

const SLASH_DEFS = [
  {sec:'Texto',       ico:'¶',  name:'Párrafo',          desc:'Texto libre',              kbd:'/p',    make:()=>({t:'p',nodes:[]})},
  {sec:'Estructura',  ico:'H1', name:'Sección',           desc:'Heading nivel 1',         kbd:'/h1',   make:()=>({t:'h1',text:''})},
  {sec:'Estructura',  ico:'H2', name:'Subsección',        desc:'Heading nivel 2',         kbd:'/h2',   make:()=>({t:'h2',text:''})},
  {sec:'Matemática',  ico:'[]', name:'Ecuación display',  desc:'Fórmula centrada',        kbd:'/[]',   make:()=>({t:'md',latex:'\\square'})},
  {sec:'Entornos',    ico:'T',  name:'Theorem',           desc:'\\begin{theorem}',        kbd:'/thm',  make:()=>({t:'thm',env:'theorem',  label:'Theorem',   nodes:[]})},
  {sec:'Entornos',    ico:'D',  name:'Definition',        desc:'\\begin{definition}',     kbd:'/def',  make:()=>({t:'thm',env:'definition',label:'Definition',nodes:[]})},
  {sec:'Entornos',    ico:'L',  name:'Lemma',             desc:'\\begin{lemma}',          kbd:'/lem',  make:()=>({t:'thm',env:'lemma',    label:'Lemma',     nodes:[]})},
  {sec:'Entornos',    ico:'P',  name:'Proof',             desc:'\\begin{proof}',          kbd:'/prf',  make:()=>({t:'thm',env:'proof',    label:'Proof',     nodes:[]})},
  {sec:'Entornos',    ico:'E',  name:'Exercise',          desc:'\\begin{exercise}',       kbd:'/ej',   make:()=>({t:'thm',env:'exercise', label:'Exercise',  nodes:[]})},
  {sec:'Entornos',    ico:'R',  name:'Remark',            desc:'\\begin{remark}',         kbd:'/rem',  make:()=>({t:'thm',env:'remark',   label:'Remark',    nodes:[]})},
];

let slashRef = null; // the .blk element where slash was triggered
let slashFiltered = [];
let slashFocus = -1;

function showSlash(blkEl) {
  slashRef = blkEl;
  slashFiltered = [...SLASH_DEFS];
  buildSlashList(slashFiltered);
  const r = blkEl.getBoundingClientRect();
  const m = document.getElementById('smenu');
  // Position below block, aligned with text start
  m.style.left = (r.left + 48) + 'px';
  m.style.top  = Math.min(r.bottom + 4, window.innerHeight - 320) + 'px';
  m.classList.add('show');
  document.getElementById('sminput').value = '';
  slashFocus = -1;
  setTimeout(() => document.getElementById('sminput').focus(), 30);
}

function buildSlashList(items) {
  const list = document.getElementById('smenu-list');
  list.innerHTML = '';
  let lastSec = null;
  items.forEach((it, i) => {
    if (it.sec !== lastSec) {
      const s = document.createElement('div'); s.className = 'sm-sec'; s.textContent = it.sec;
      list.appendChild(s); lastSec = it.sec;
    }
    const row = document.createElement('div'); row.className = 'sm-row'; row.dataset.i = i;
    row.innerHTML = `<div class="sm-ico">${it.ico}</div><div class="sm-info"><div class="sm-name">${it.name}</div><div class="sm-desc">${it.desc}</div></div><span class="sm-kbd">${it.kbd}</span>`;
    row.addEventListener('mousedown', e => e.preventDefault());
    row.addEventListener('click', () => pickSlash(it));
    list.appendChild(row);
  });
}

document.getElementById('sminput').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  slashFiltered = q ? SLASH_DEFS.filter(d => d.name.toLowerCase().includes(q) || d.kbd.includes(q)) : [...SLASH_DEFS];
  buildSlashList(slashFiltered);
  slashFocus = -1;
});

document.getElementById('sminput').addEventListener('keydown', e => {
  const rows = document.querySelectorAll('.sm-row');
  if (e.key === 'Escape') { closeSlash(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); slashFocus = Math.min(slashFocus+1, rows.length-1); updSlashFocus(rows); return; }
  if (e.key === 'ArrowUp')   { e.preventDefault(); slashFocus = Math.max(slashFocus-1, 0); updSlashFocus(rows); return; }
  if (e.key === 'Enter') {
    e.preventDefault();
    const pick = slashFiltered[slashFocus >= 0 ? slashFocus : 0];
    if (pick) pickSlash(pick);
  }
});

function updSlashFocus(rows) {
  rows.forEach((r,i) => r.classList.toggle('focused', i === slashFocus));
  rows[slashFocus]?.scrollIntoView({block:'nearest'});
}

function pickSlash(def) {
  closeSlash();
  if (!slashRef) return;
  const refId  = slashRef.dataset.bid;
  const refBl  = BLOCKS.find(b => b.id === refId);
  const isEmptyP = refBl && refBl.t === 'p' && (refBl.nodes||[]).length === 0;

  const nb = { id: uid(), ...def.make() };

  if (isEmptyP) {
    // Replace the empty paragraph with the new block
    Object.assign(refBl, nb, { id: refId });
    nb.id = refId;
    const oldEl = document.querySelector(`.blk[data-bid="${refId}"]`);
    const newEl = mkBlock(refBl);
    oldEl.replaceWith(newEl);
    if (nb.t === 'md') {
      setTimeout(() => { const el = newEl.querySelector('.md'); if(el) openFml(el,true); }, 60);
    } else {
      const ed = newEl.querySelector('[contenteditable]');
      if (ed) { setTimeout(() => { ed.focus(); placeAtStart(ed); }, 30); }
    }
  } else {
    insertAfter(refId, nb);
    if (nb.t === 'md') {
      setTimeout(() => {
        const el = document.querySelector(`.blk[data-bid="${nb.id}"] .md`);
        if (el) openFml(el, true);
      }, 80);
    }
  }
  dirty();
}

function closeSlash() {
  document.getElementById('smenu').classList.remove('show');
  slashRef = null;
}

function wrapSelectionAsFml() {

    c.style.top  = (r.top - 32) + 'px';
    c.querySelectorAll('.hcb').forEach(b => b.classList.toggle('on', b.dataset.l === bt.replace('h','')));
    c.classList.add('show');
  } else {
    document.getElementById('hctrl').classList.remove('show');
    hctrlBlk = null;
  }
});

document.getElementById('hctrl').querySelectorAll('.hcb').forEach(btn => {
  btn.addEventListener('mousedown', e => e.preventDefault());
  btn.addEventListener('click', () => {
    if (!hctrlBlk) return;
    const bid  = hctrlBlk.dataset.bid;
    const newT = 'h' + btn.dataset.l;
    const bl   = BLOCKS.find(b => b.id === bid);
    const ed   = hctrlBlk.querySelector('[contenteditable]');
    if (!bl || !ed) return;
    const curText = ed.textContent;
    bl.t = newT; bl.text = curText;
    const newEl = mkBlock(bl);
    hctrlBlk.replaceWith(newEl);
    hctrlBlk = newEl;
    const newEd = newEl.querySelector('[contenteditable]');
    if (newEd) { newEd.focus(); placeAtEnd(newEd); }
    document.getElementById('hctrl').querySelectorAll('.hcb').forEach(b => b.classList.toggle('on', b === btn));
    dirty();
  });
});

/* ══════════════════════════════════════
   COACH PANEL
   ══════════════════════════════════════ */
function buildCoach(latex, isDisp, envType) {
  const changes = [];
  if (/\(\\frac|\(\int|\(\\sum/.test(latex) && !latex.includes('\\left('))
    changes.push({type:'warn', badge:'AUTO', title:'Delimitadores', desc:'Parentesis sin \\left/\\right no escalan.', before:latex.slice(0,32), after:latex.replace(/\(/g,'\\left(').replace(/\)/g,'\\right)').slice(0,32)});
  if (/\\int[^\\]*[^,\s]d[xyztu]/.test(latex))
    changes.push({type:'warn', badge:'AUTO', title:'Thin space \\,dx', desc:'Convención: thin space antes del diferencial.', before:'dx', after:'\\,dx'});
  if (latex.includes('\\mathbb{'))
    changes.push({type:'info', badge:'MACRO', title:'Usar macro \\R', desc:'El manifiesto define \\R, \\N, \\Z, etc.', before:'\\mathbb{R}', after:'\\R'});

  const body = document.getElementById('chbody');
  body.innerHTML = '';
  const hmap = {theorem:'Si vas a referenciar esta ecuación, marcala como <strong>Numerada</strong>.',proof:'Para pasos alineados usá <strong>align*</strong> con &amp;=.',exercise:'Numerá la ecuación principal para poder referenciarla.',definition:'Verificá que los cuantificadores tengan \\text{}.'};
  if (envType && hmap[envType]) {
    const h = document.createElement('div'); h.className = 'chhint';
    const p = document.createElement('div'); p.className = 'envpill'; p.textContent = envType.charAt(0).toUpperCase()+envType.slice(1);
    const t = document.createElement('div'); t.innerHTML = hmap[envType];
    h.appendChild(p); h.appendChild(t); body.appendChild(h);
  }
  if (changes.length) {
    const cards = document.createElement('div'); cards.className = 'chcards';
    changes.forEach(c => {
      const card = document.createElement('div'); card.className = `chcard ${c.type}`;
      card.innerHTML = `<div class="chcard-hd"><span class="cbadge">${c.badge}</span>${c.title}</div>`;
      const bd = document.createElement('div'); bd.className = 'chbd';
      const j  = document.createElement('div'); j.className = 'chjust'; j.textContent = c.desc;
      bd.appendChild(j);
      if (c.before && c.after) {
        const code = document.createElement('div'); code.className = 'chcode';
        code.innerHTML = `<div class="cbefore">${esc(c.before)}</div><div style="color:var(--ink4)">↓</div><div class="cafter">${esc(c.after)}</div>`;
        bd.appendChild(code);
      }
      const acts = document.createElement('div'); acts.className = 'chacts';
      const ok = document.createElement('button'); ok.className = 'ca ok'; ok.textContent = '✓ Aplicar';
      ok.addEventListener('click', () => { card.style.opacity='0'; setTimeout(()=>card.remove(),180); });
      const ig = document.createElement('button'); ig.className = 'ca'; ig.textContent = 'Ignorar';
      ig.addEventListener('click', () => { card.style.opacity='0'; setTimeout(()=>card.remove(),180); });
      acts.appendChild(ok); acts.appendChild(ig); bd.appendChild(acts); card.appendChild(bd);
      cards.appendChild(card);
    });
    body.appendChild(cards);
  } else if (!envType) {
    const em = document.createElement('div'); em.style.cssText='padding:12px 10px;font-size:9.5px;color:var(--ink4);text-align:center'; em.textContent='✓ Sin sugerencias';
    body.appendChild(em);
  }
  document.getElementById('coach').classList.add('open');
}

document.getElementById('chclose').addEventListener('click', () => document.getElementById('coach').classList.remove('open'));

/* ══════════════════════════════════════
   CLOSE ON OUTSIDE CLICK / ESCAPE
   ══════════════════════════════════════ */
document.addEventListener('mousedown', e => {
  if (!e.target.closest('#smenu') && !e.target.closest('.blk')) closeSlash();
  if (!e.target.closest('[data-pm]') && plusMenu && !e.target.closest('.plus-btn')) { plusMenu.remove(); plusMenu = null; }
  if (!e.target.closest('#sbub')) {
    const sel = window.getSelection();
    if (!sel?.toString()) hideSBub();
  }
  if (!e.target.closest('#hctrl') && !e.target.closest('.bh1') && !e.target.closest('.bh2'))
    document.getElementById('hctrl').classList.remove('show');
  if (!e.target.closest('#fp') && !e.target.closest('.mc') && !e.target.closest('.md') && !e.target.closest('#pal'))
    closeFml(false);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeSlash(); hideSBub();
    if (plusMenu) { plusMenu.remove(); plusMenu = null; }
    closeFml(true);
  }
});

/* ══════════════════════════════════════
   SAVE INDICATOR
   ══════════════════════════════════════ */
let saveT;
function dirty() {
  const d = document.getElementById('sdot');
  d.classList.add('dirty');
  clearTimeout(saveT);
  saveT = setTimeout(() => d.classList.remove('dirty'), 1400);
}

document.getElementById('dp').addEventListener('input', dirty);
